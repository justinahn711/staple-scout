name: Native iPhone
on:
  push:
    branches: [main, feature/native-iphone-app]
  pull_request:
    paths: ['iOS/**', '.github/workflows/ios.yml']
jobs:
  swift-core:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path iOS/Packages/StapleScoutKit
      - name: Select an available iPhone simulator
        run: |
          scout_simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,group in devices.items() if "iOS" in runtime for d in group if d["name"].startswith("iPhone")))')
          echo "SCOUT_SIMULATOR_ID=$scout_simulator_id" >> "$GITHUB_ENV"
      - name: Build and test iPhone application
        run: >-
          xcodebuild -project iOS/StapleScout.xcodeproj -scheme StapleScout
          -destination "platform=iOS Simulator,id=$SCOUT_SIMULATOR_ID"
          -parallel-testing-enabled NO -test-timeouts-enabled YES
          -default-test-execution-time-allowance 30 -maximum-test-execution-time-allowance 30
          CODE_SIGNING_ALLOWED=NO test
  pilot:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        run: |
          scout_pilot_simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,group in devices.items() if "iOS" in runtime for d in group if d["name"].startswith("iPhone")))')
          echo "SCOUT_PILOT_SIMULATOR_ID=$scout_pilot_simulator_id" >> "$GITHUB_ENV"
      - name: Test fail-closed pilot configuration and native sessions
        run: >-
          xcodebuild -project iOS/StapleScout.xcodeproj -scheme ThriftyMarketPilot
          -configuration Pilot
          -destination "platform=iOS Simulator,id=$SCOUT_PILOT_SIMULATOR_ID"
          -derivedDataPath "$RUNNER_TEMP/thrifty-pilot-simulator"
          -parallel-testing-enabled NO -test-timeouts-enabled YES
          -default-test-execution-time-allowance 30 -maximum-test-execution-time-allowance 30
          CODE_SIGNING_ALLOWED=NO test
      - name: Build pilot for physical iPhone without signing or activation
        run: >-
          xcodebuild -project iOS/StapleScout.xcodeproj -scheme ThriftyMarketPilot
          -configuration Pilot -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/thrifty-pilot-device"
          CODE_SIGNING_ALLOWED=NO build
