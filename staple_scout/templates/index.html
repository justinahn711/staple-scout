<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Staple Scout</title>
    <link rel="stylesheet" href="/static/app.css" />
    <link rel="stylesheet" href="/static/comparisons.css" />
    <link rel="stylesheet" href="/static/reports.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-inner">
        <a class="brand" href="/" aria-label="Staple Scout"
          ><span class="brand-mark">SS</span
          ><span
            ><strong>Staple Scout</strong
            ><small>Your grocery staples</small></span
          ></a
        >
        <p id="status" class="status" role="status" aria-live="polite">
          Loading your setup…
        </p>
      </div>
    </header>
    <main>
      <nav class="tabs" aria-label="Grocery sections" role="tablist">
        <button
          class="tab active"
          role="tab"
          aria-selected="true"
          data-tab="staples"
        >
          Staples</button
        ><button class="tab" role="tab" aria-selected="false" data-tab="stores">
          Stores</button
        ><button class="tab" role="tab" aria-selected="false" data-tab="price">
          Record price</button
        ><button
          class="tab"
          role="tab"
          aria-selected="false"
          data-tab="matches"
        >
          Review matches
        </button>
        <button class="tab" role="tab" aria-selected="false" data-tab="compare">Compare prices</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="shopping">This week</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="report">Weekly report</button>
      </nav>
      <div
        id="error-region"
        tabindex="-1"
        class="error-region"
        role="alert"
        hidden
      ></div>
      <section role="tabpanel" id="panel" aria-live="polite"></section>
    </main>
    <script src="/static/comparisons.js" defer></script>
    <script src="/static/reports.js" defer></script>
    <script src="/static/app.js" defer></script>
  </body>
</html>
